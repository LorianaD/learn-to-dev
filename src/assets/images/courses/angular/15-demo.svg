<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"><title>Navigation protégée</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#2459a8"/></marker></defs><rect x="0" y="0" width="1000" height="560" rx="0" fill="#f1f5fb" stroke="none"/><text x="35" y="48" font-family="Arial, sans-serif" font-size="30" fill="#17233e" font-weight="700">Navigation protégée</text><text x="35" y="80" font-family="Arial, sans-serif" font-size="19" fill="#52627a" font-weight="400">Illustration pédagogique • exemple simulé, pas une capture réelle</text><rect x="35" y="110" width="930" height="410" rx="12" fill="#fff" stroke="#cbd6e5"/><text x="60" y="160" font-family="Arial, sans-serif" font-size="26" fill="#2459a8" font-weight="700">Contrôle de navigation</text><text x="60" y="215" font-family="Arial, sans-serif" font-size="25" fill="#17233e" font-weight="400">Sans token : /login</text><text x="60" y="290" font-family="Arial, sans-serif" font-size="25" fill="#17233e" font-weight="400">Avec token : accès à /tasks</text><text x="60" y="365" font-family="Arial, sans-serif" font-size="25" fill="#17233e" font-weight="400">Authorization: Bearer …</text><text x="60" y="470" font-family="Arial, sans-serif" font-size="22" fill="#087b64" font-weight="700">Le backend reste responsable de la sécurité.</text></svg>